[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-bridge"
version = "0.1.0"
description = "Local selective Claude Code and Codex context migration"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
agent-bridge = "bridge.cli:main"

[tool.setuptools.packages.find]
include = ["bridge*"]
